<!doctype html>
<html lang="id" class="h-full dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>JajanBuah - Fruit Operations & Fulfillment Management</title>
    <meta name="description" content="Sistem manajemen operasional penimbangan buah segar, alokasi kapasitas packer gudang, kanban fulfillment, dan monitor TV gudang realtime." />
    <meta property="og:title" content="JajanBuah - Fruit Operations & Fulfillment Management" />
    <meta property="og:description" content="Sistem manajemen operasional penimbangan buah segar, alokasi kapasitas packer gudang, kanban fulfillment, dan monitor TV gudang realtime." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0b1222" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="JajanBuah" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('jajanbuah_theme');
          if (theme === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="h-full antialiased selection:bg-slate-900 selection:text-white bg-[#0b1222] dark:bg-[#0b1222] text-slate-900 dark:text-slate-100 transition-colors duration-200">
    <div id="root" class="min-h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
